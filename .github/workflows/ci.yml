
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: fastapi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fastapi_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENV_FILE: .env.test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Create test environment
        run: |
          cat > .env.test <<'EOF'
          APP_NAME=Interloid Task Manager
          APP_VERSION=0.1.0
          DEBUG=False
          HOST=0.0.0.0
          PORT=8000
          LOG_LEVEL=INFO

          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=fastapi_db
          DB_USER=postgres
          DB_PASSWORD=password
          DB_SSL=false

          REDIS_URL=redis://localhost:6379/0
          REDIS_KEY_PREFIX=ci_login_rate_limit
          MAX_SSE_CONNECTIONS=3
          SSE_CONNECTION_TTL=60
          SSE_CONNECTION_KEY_PREFIX=ci_test_sse_connections

          SECRET_KEY=ci-test-secret-key
          FRONTEND_URL=http://localhost:5173
          COOKIE_SECURE=false
          COOKIE_SAMESITE=lax

          AWS_REGION=ap-southeast-1
          S3_BUCKET_NAME=ci-test-bucket

          SMTP_HOST=localhost
          SMTP_PORT=587
          SMTP_USERNAME=test-user
          SMTP_PASSWORD=test-password
          SMTP_FROM_EMAIL=test@example.com
          SMTP_USE_TLS=false

          OTP_SECRET_KEY=ci-test-otp-secret-key-at-least-32-characters
          GOOGLE_CLIENT_ID=test-client-id
          GOOGLE_CLIENT_SECRET=test-client-secret
          GOOGLE_REDIRECT_URI=http://localhost:8000/api/v1/auth/google/callback

          JWT_SECRET_KEY=ci-test-jwt-secret-key-at-least-32-characters-long
          JWT_ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          REFRESH_TOKEN_EXPIRE_DAYS=7
          EMAIL_OTP_EXPIRE_MINUTES=5
          EMAIL_OTP_MAX_ATTEMPTS=5
          EMAIL_OTP_RESEND_COOLDOWN_SECONDS=60
          PASSWORD_RESET_OTP_RESEND_COOLDOWN_SECONDS=60
          EOF

      - name: Install project dependencies
        run: uv sync --locked --all-groups

      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest -v
