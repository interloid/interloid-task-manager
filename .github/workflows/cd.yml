
name: CD

on:
  # Automatically deploy develop after successful CI
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - develop

  # Allow manual deployment of any selected branch
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ec2-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Push and Deploy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Manual deployments must have a successful CI run
      - name: Verify CI passed for selected branch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          RUNS=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SOURCE_SHA}&status=completed&per_page=100")

          if ! echo "$RUNS" | jq -e \
            --arg sha "$SOURCE_SHA" \
            --arg branch "$SOURCE_BRANCH" \
            '[.workflow_runs[] | select(
              .head_sha == $sha and
              .head_branch == $branch and
              .conclusion == "success"
            )] | length > 0' > /dev/null; then
            echo "No successful CI run found for ${SOURCE_BRANCH} at ${SOURCE_SHA}"
            exit 1
          fi

          echo "CI verification successful."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tag
        id: image
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "tag=${SOURCE_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        run: |
          bash scripts/push-image.sh "${{ steps.image.outputs.tag }}"

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Configure SSH known hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          ssh ec2-user@"$EC2_HOST" \
            "bash ~/deploy.sh '$IMAGE_TAG'"
